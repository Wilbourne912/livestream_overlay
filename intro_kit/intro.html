<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Lotto Lit 912 Intro</title>
<style>
  @font-face {
    font-family: 'Blanka';
    src: url('blanka.ttf');
  }

  :root {
    --red: #ff3131;
    --dark-red: #8a1010;
    --black: #000000;
    --gold: #f2a900;
    --total: 5s;
  }

  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  #stage {
    position: absolute;
    inset: 0;
    background: var(--red);
    overflow: hidden;
    clip-path: inset(0 100% 0 0);
    animation: stage var(--total) cubic-bezier(.7, 0, .3, 1) forwards;
  }

  @keyframes stage {
    0%   { clip-path: inset(0 100% 0 0); }
    14%  { clip-path: inset(0 0 0 0); }
    88%  { clip-path: inset(0 0 0 0); }
    100% { clip-path: inset(0 0 0 100%); }
  }

  #flag {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 860px;
    transform: translate(-50%, -46%);
    opacity: 0;
    animation: flag 1.2s ease-out .5s forwards;
  }

  @keyframes flag {
    from { opacity: 0; transform: translate(-50%, -38%); }
    to   { opacity: .3; transform: translate(-50%, -46%); }
  }

  .bar {
    position: absolute;
    background: var(--dark-red);
    opacity: 0;
    animation: flicker .9s steps(1, end) forwards;
  }

  .bar:nth-of-type(1) { left: 260px;  top: 330px; width: 520px; height: 28px; animation-delay: 1.0s; }
  .bar:nth-of-type(2) { left: 1180px; top: 420px; width: 480px; height: 60px; animation-delay: 1.1s; }
  .bar:nth-of-type(3) { left: 420px;  top: 640px; width: 700px; height: 18px; animation-delay: 1.15s; }
  .bar:nth-of-type(4) { left: 980px;  top: 300px; width: 260px; height: 90px; animation-delay: 1.2s; }
  .bar:nth-of-type(5) { left: 140px;  top: 520px; width: 380px; height: 44px; animation-delay: 1.25s; }

  @keyframes flicker {
    0%   { opacity: .85; }
    18%  { opacity: 0; }
    34%  { opacity: .7; }
    50%  { opacity: 0; }
    66%  { opacity: .5; }
    82%  { opacity: 0; }
    100% { opacity: 0; }
  }

  #wordmark {
    position: absolute;
    left: 50%;
    top: 400px;
    margin: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    font-family: 'Blanka', 'Arial Black', Impact, sans-serif;
    font-weight: 400;
    font-size: 170px;
    letter-spacing: 8px;
    color: var(--black);
    opacity: 0;
    animation: slam .8s linear 1.2s forwards;
  }

  @keyframes slam {
    0%   { opacity: 0; transform: translateX(-50%) scale(1.3); }
    20%  { opacity: 1; transform: translateX(calc(-50% - 28px)) scale(1.05) skewX(-10deg); }
    40%  { transform: translateX(calc(-50% + 20px)) scale(1) skewX(6deg); }
    60%  { transform: translateX(calc(-50% - 10px)) skewX(-3deg); }
    80%  { transform: translateX(calc(-50% + 5px)); }
    100% { opacity: 1; transform: translateX(-50%) scale(1); }
  }

  #rule {
    position: absolute;
    left: 50%;
    top: 620px;
    width: 1000px;
    height: 8px;
    background: var(--black);
    transform: translateX(-50%) scaleX(0);
    animation: rule .5s ease-out 1.9s forwards;
  }

  @keyframes rule {
    to { transform: translateX(-50%) scaleX(1); }
  }

  #emblem {
    position: absolute;
    left: 50%;
    top: 680px;
    height: 250px;
    transform: translateX(-50%) scale(0);
    filter: drop-shadow(0 0 22px rgba(242, 169, 0, .75));
    animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) 2.2s forwards;
  }

  @keyframes pop {
    from { transform: translateX(-50%) scale(0) rotate(-10deg); }
    to   { transform: translateX(-50%) scale(1) rotate(0deg); }
  }
</style>
</head>
<body>
<div id="stage">
  <img id="flag" src="flag-silhouette.png">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <h1 id="wordmark">Lotto Lit 912</h1>
  <div id="rule"></div>
  <img id="emblem" src="912-emblem.png">
</div>
</body>
</html>
